services:
  postgres:
    image: postgres:16
    container_name: fabrica_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres_proyectos:
    image: postgres:16
    container_name: fabrica_postgres_proyectos
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${PROJECTS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PROJECTS_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PROJECTS_POSTGRES_DB:-fabrica_proyectos}
    ports:
      - "5433:5432"
    volumes:
      - postgres_proyectos_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: fabrica_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  orquestador:
    build:
      context: ./orquestador
      args:
        REQS_HASH: ${REQS_HASH:-1}
    container_name: fabrica_orquestador
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - qdrant
    volumes:
      - ./orquestador/src:/app/src
      - sandbox_workspace:/sandbox-workspace
      - /var/run/docker.sock:/var/run/docker.sock
    stdin_open: true   # necesario para los checkpoints humanos por terminal (§10 del plan)
    tty: true

  sandbox:
    build: ./sandbox
    container_name: fabrica_sandbox
    restart: unless-stopped
    volumes:
      - sandbox_workspace:/workspace

volumes:
  postgres_data:
  postgres_proyectos_data:
  qdrant_data:
  sandbox_workspace:

